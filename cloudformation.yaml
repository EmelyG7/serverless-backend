AWSTemplateFormatVersion: '2010-09-09'
Description: 'Lab Access Request System Infrastructure with CockroachDB'

Parameters:
  CockroachDbUrl:
    Type: String
    Description: CockroachDB connection URL (e.g., jdbc:postgresql://host:port/db?sslmode=verify-full)
    NoEcho: true
    Default: "jdbc:postgresql://blog-db-13456.7tt.aws-us-east-1.cockroachlabs.cloud:26257/serverless?sslmode=verify-full"
  CockroachDbUser:
    Type: String
    Description: CockroachDB username
    NoEcho: true
    Default: "emely"
  CockroachDbPassword:
    Type: String
    Description: CockroachDB password
    NoEcho: true
    Default: "Md3vIHmSjvOuG_CMaK--1Q"

Resources:
  # Lambda Functions
  CreateReservacionFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: CreateReservacion
      Runtime: java17
      Handler: org.pucmm.practica.serverleslambdaaws.handler.CreateReservacionHandler
      Role: arn:aws:iam::348345132515:role/LabRole  # Usamos LabRole
      Timeout: 30
      MemorySize: 512
      Code:
        S3Bucket: lab-access-bucket-emely-2025
        S3Key: ServerlesLambdaAws-0.0.1-SNAPSHOT.jar
      Environment:
        Variables:
          COCKROACH_URL: !Ref CockroachDbUrl
          COCKROACH_USER: !Ref CockroachDbUser
          COCKROACH_PASSWORD: !Ref CockroachDbPassword

  GetActiveReservacionesFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: GetActiveReservaciones
      Runtime: java17
      Handler: org.pucmm.practica.serverleslambdaaws.handler.GetActiveReservacionesHandler
      Role: arn:aws:iam::348345132515:role/LabRole  # Usamos LabRole
      Timeout: 30
      MemorySize: 512
      Code:
        S3Bucket: lab-access-bucket-emely-2025
        S3Key: ServerlesLambdaAws-0.0.1-SNAPSHOT.jar
      Environment:
        Variables:
          COCKROACH_URL: !Ref CockroachDbUrl
          COCKROACH_USER: !Ref CockroachDbUser
          COCKROACH_PASSWORD: !Ref CockroachDbPassword

  GetPastReservacionesFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: GetPastReservaciones
      Runtime: java17
      Handler: org.pucmm.practica.serverleslambdaaws.handler.GetPastReservacionesHandler
      Role: arn:aws:iam::348345132515:role/LabRole  # Usamos LabRole
      Timeout: 30
      MemorySize: 512
      Code:
        S3Bucket: lab-access-bucket-emely-2025
        S3Key: ServerlesLambdaAws-0.0.1-SNAPSHOT.jar
      Environment:
        Variables:
          COCKROACH_URL: !Ref CockroachDbUrl
          COCKROACH_USER: !Ref CockroachDbUser
          COCKROACH_PASSWORD: !Ref CockroachDbPassword

  # API Gateway
  LabAccessApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: LabAccessApi
      Description: API for Lab Access Request System
      EndpointConfiguration:
        Types:
          - REGIONAL

  ReservationsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref LabAccessApi
      ParentId: !GetAtt LabAccessApi.RootResourceId
      PathPart: reservations

  ActiveReservationsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref LabAccessApi
      ParentId: !Ref ReservationsResource
      PathPart: active

  PastReservationsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref LabAccessApi
      ParentId: !Ref ReservationsResource
      PathPart: past

  CreateReservationMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref LabAccessApi
      ResourceId: !Ref ReservationsResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CreateReservacionFunction.Arn}/invocations
      MethodResponses:
        - StatusCode: 200
          ResponseModels:
            application/json: Empty

  GetActiveReservationsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref LabAccessApi
      ResourceId: !Ref ActiveReservationsResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GetActiveReservacionesFunction.Arn}/invocations
      MethodResponses:
        - StatusCode: 200
          ResponseModels:
            application/json: Empty

  GetPastReservationsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref LabAccessApi
      ResourceId: !Ref PastReservationsResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GetPastReservacionesFunction.Arn}/invocations
      MethodResponses:
        - StatusCode: 200
          ResponseModels:
            application/json: Empty

  # CORS Configuration for all methods
  ReservationsCorsOptions:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref LabAccessApi
      ResourceId: !Ref ReservationsResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key'"
              method.response.header.Access-Control-Allow-Methods: "'POST,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
            ResponseTemplates:
              application/json: '{}'
        RequestTemplates:
          application/json: '{"statusCode": 200}'
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true
          ResponseModels:
            application/json: Empty

  ActiveReservationsCorsOptions:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref LabAccessApi
      ResourceId: !Ref ActiveReservationsResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key'"
              method.response.header.Access-Control-Allow-Methods: "'GET,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
            ResponseTemplates:
              application/json: '{}'
        RequestTemplates:
          application/json: '{"statusCode": 200}'
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true
          ResponseModels:
            application/json: Empty

  PastReservationsCorsOptions:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref LabAccessApi
      ResourceId: !Ref PastReservationsResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key'"
              method.response.header.Access-Control-Allow-Methods: "'GET,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
            ResponseTemplates:
              application/json: '{}'
        RequestTemplates:
          application/json: '{"statusCode": 200}'
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true
          ResponseModels:
            application/json: Empty

  # Deployment and Stage
  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - CreateReservationMethod
      - GetActiveReservationsMethod
      - GetPastReservationsMethod
      - ReservationsCorsOptions
      - ActiveReservationsCorsOptions
      - PastReservationsCorsOptions
    Properties:
      RestApiId: !Ref LabAccessApi
      StageName: prod

  # Lambda Permissions
  CreateReservationPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref CreateReservacionFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${LabAccessApi}/*/POST/reservations

  GetActiveReservationsPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref GetActiveReservacionesFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${LabAccessApi}/*/GET/reservations/active

  GetPastReservationsPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref GetPastReservacionesFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${LabAccessApi}/*/GET/reservations/past

Outputs:
  ApiUrl:
    Description: URL of the API endpoint
    Value: !Sub https://${LabAccessApi}.execute-api.${AWS::Region}.amazonaws.com/prod